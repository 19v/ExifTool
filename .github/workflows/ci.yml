name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "$xcode_path" ]]; then
            echo "Xcode 26 is not installed on this runner."
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_path/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Validate string catalogs
        shell: bash
        run: |
          set -euo pipefail
          catalogs=(
            ExifTool/Localizable.xcstrings
            ShareExtension/Localizable.xcstrings
          )
          for catalog in "${catalogs[@]}"; do
            jq empty "$catalog"
            jq -e '
              all(
                .strings[];
                (.localizations.en.stringUnit.state == "translated") and
                (.localizations["zh-Hans"].stringUnit.state == "translated")
              )
            ' "$catalog" > /dev/null
          done

      - name: Validate privacy manifests
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ExifTool/PrivacyInfo.xcprivacy
          plutil -lint ShareExtension/PrivacyInfo.xcprivacy
          plutil -convert json -o - ExifTool/PrivacyInfo.xcprivacy | jq -e '
            (.NSPrivacyTracking == false) and
            (.NSPrivacyCollectedDataTypes == []) and
            any(.NSPrivacyAccessedAPITypes[];
              .NSPrivacyAccessedAPIType == "NSPrivacyAccessedAPICategoryUserDefaults" and
              (.NSPrivacyAccessedAPITypeReasons | contains(["CA92.1"]))) and
            any(.NSPrivacyAccessedAPITypes[];
              .NSPrivacyAccessedAPIType == "NSPrivacyAccessedAPICategoryFileTimestamp" and
              (.NSPrivacyAccessedAPITypeReasons | contains(["3B52.1", "C617.1"])))
          ' > /dev/null
          plutil -convert json -o - ShareExtension/PrivacyInfo.xcprivacy | jq -e '
            (.NSPrivacyTracking == false) and
            (.NSPrivacyCollectedDataTypes == []) and
            any(.NSPrivacyAccessedAPITypes[];
              .NSPrivacyAccessedAPIType == "NSPrivacyAccessedAPICategoryFileTimestamp" and
              (.NSPrivacyAccessedAPITypeReasons | contains(["C617.1"])))
          ' > /dev/null

      - name: Validate RAW test fixtures
        shell: bash
        run: |
          set -euo pipefail
          echo '51b7953e8b263c4b92be90318079ec1be111b4af6a23f0719310311150fbaeb6  ExifToolTests/Fixtures/MakerNotes/Nikon_Z8.nef' | shasum -a 256 -c -
          echo '7740a5666cff3127f81397b15e0ee507ff7e6161dd8576d7cfbb4eabe22882b0  ExifToolTests/Fixtures/MakerNotes/Fujifilm_X-T5.raf' | shasum -a 256 -c -

      - name: Run macOS tests
        run: |
          xcodebuild \
            -project ExifTool.xcodeproj \
            -scheme ExifTool \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/derived-data/macos-debug" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build macOS Release
        run: |
          xcodebuild \
            -project ExifTool.xcodeproj \
            -scheme ExifTool \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/derived-data/macos-release" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Debug app and share extension
        run: |
          xcodebuild \
            -project ExifTool.xcodeproj \
            -scheme ExifTool \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data/ios-debug" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Debug share extension embedding
        shell: bash
        run: |
          set -euo pipefail
          appex="$RUNNER_TEMP/derived-data/ios-debug/Build/Products/Debug-iphonesimulator/ExifTool.app/PlugIns/ExifToolShareExtension.appex"
          test -d "$appex"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$appex/Info.plist")"
          test "$bundle_id" = "com.echopie.ExifTool.ShareExtension"

      - name: Run iOS tests
        shell: bash
        run: |
          set -euo pipefail
          destination_id="$(
            xcrun simctl list devices available --json |
              jq -r '[.devices[][] | select(.isAvailable and (.deviceTypeIdentifier | contains("iPhone")))][0].udid'
          )"
          test -n "$destination_id"
          test "$destination_id" != "null"
          xcodebuild \
            -project ExifTool.xcodeproj \
            -scheme ExifToolIOSTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -derivedDataPath "$RUNNER_TEMP/derived-data/ios-tests" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Archive iOS Release app and share extension
        run: |
          xcodebuild \
            -project ExifTool.xcodeproj \
            -scheme ExifTool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/archives/ExifTool.xcarchive" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify Release archive contents
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/archives/ExifTool.xcarchive/Products/Applications/ExifTool.app"
          appex="$app/PlugIns/ExifToolShareExtension.appex"
          test -d "$app"
          test -d "$appex"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$appex/PrivacyInfo.xcprivacy"
          cmp ExifTool/PrivacyInfo.xcprivacy "$app/PrivacyInfo.xcprivacy"
          cmp ShareExtension/PrivacyInfo.xcprivacy "$appex/PrivacyInfo.xcprivacy"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$appex/Info.plist")"
          test "$bundle_id" = "com.echopie.ExifTool.ShareExtension"
          grep -q 'group.com.echopie.ExifTool' ExifTool/ExifTool.entitlements
          grep -q 'group.com.echopie.ExifTool' ShareExtension.entitlements
